<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ubicación</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b0f0c; --fg:#d7f5de; --muted:#7f9a87; --accent:#3ddc84; --err:#ff6b6b; --card:#121a14; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px 16px; text-align:center; }
  .ring { width:84px; height:84px; border-radius:50%; border:3px solid #1f2d23; border-top-color:var(--accent);
    animation:spin 0.9s linear infinite; display:grid; place-items:center; }
  .ring.ok { animation:none; border-color:var(--accent); }
  .ring.err { animation:none; border-color:var(--err); }
  .ring span { font-size:34px; line-height:1; animation:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.2px; }
  p { margin:0; max-width:320px; color:var(--muted); font-size:15px; line-height:1.45; }
  .acciones { display:none; flex-direction:column; gap:10px; width:100%; max-width:320px; margin-top:6px; }
  button { appearance:none; border:0; border-radius:12px; padding:14px 16px; font-size:16px; font-weight:600;
    background:var(--accent); color:#04210f; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid #1f2d23; }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
<main>
  <div class="ring" id="ring"><span id="icono"></span></div>
  <h1 id="titulo">Obteniendo tu ubicación…</h1>
  <p id="texto">Si Telegram te pregunta, toca «Permitir». Esta pantalla se cierra sola.</p>
  <div class="acciones" id="acciones">
    <button id="btnReintentar">Reintentar</button>
    <button id="btnAjustes" class="sec" style="display:none">Abrir ajustes de ubicación</button>
    <button id="btnCerrar" class="sec">Cerrar</button>
  </div>
</main>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var enviado = false;
  var intento = 0;

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function estado(tipo, titulo, texto, icono) {
    $("ring").className = "ring" + (tipo ? " " + tipo : "");
    $("icono").textContent = icono || "";
    $("titulo").textContent = titulo;
    $("texto").textContent = texto;
    $("acciones").style.display = tipo === "err" ? "flex" : "none";
  }

  function error(titulo, texto, conAjustes) {
    estado("err", titulo, texto, "!");
    $("btnAjustes").style.display = conAjustes ? "block" : "none";
  }

  function enviar(lat, lon, precision) {
    if (enviado) return;
    if (typeof lat !== "number" || typeof lon !== "number" || isNaN(lat) || isNaN(lon)) {
      return error("No se pudo leer el GPS", "Enciende el GPS del celular e inténtalo de nuevo.", false);
    }
    enviado = true;
    estado("ok", "Ubicación enviada", "Listo, ya puedes seguir trabajando.", "✓");
    var carga = JSON.stringify({
      tipo: "ubicacion",
      lat: Math.round(lat * 1e6) / 1e6,
      lon: Math.round(lon * 1e6) / 1e6,
      precision: Math.round(precision || 0)
    });
    // sendData cierra la pantalla y entrega los datos al bot sin escribir nada en el chat.
    setTimeout(function () { try { tg.sendData(carga); } catch (e) { enviado = false; error("No se pudo enviar", "Cierra e inténtalo de nuevo desde el botón del bot.", false); } }, 700);
  }

  function viaNavegador(miIntento) {
    if (!navigator.geolocation) {
      return error("Sin GPS disponible", "Este dispositivo no permite leer la ubicación.", false);
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      if (miIntento !== intento) return;
      enviar(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    }, function (err) {
      if (miIntento !== intento) return;
      if (err && err.code === 1) {
        error("Ubicación bloqueada", "Permite el acceso a la ubicación para Telegram y toca «Reintentar».", !!(tg && tg.LocationManager));
      } else {
        error("No se pudo obtener el GPS", "Enciende el GPS, sal a un lugar abierto y toca «Reintentar».", false);
      }
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function viaTelegram(miIntento) {
    var LM = tg && tg.LocationManager;
    if (!LM) return viaNavegador(miIntento);
    var respondio = false;
    // Si el administrador de ubicación de Telegram no responde, se usa el del navegador.
    var plan_b = setTimeout(function () { if (!respondio && miIntento === intento) viaNavegador(miIntento); }, 8000);
    LM.init(function () {
      if (miIntento !== intento) return;
      if (LM.isLocationAvailable === false) { respondio = true; clearTimeout(plan_b); return viaNavegador(miIntento); }
      LM.getLocation(function (loc) {
        respondio = true; clearTimeout(plan_b);
        if (miIntento !== intento) return;
        if (loc) {
          enviar(loc.latitude, loc.longitude, loc.horizontal_accuracy);
        } else {
          error("Ubicación bloqueada", "Permite el acceso a la ubicación para este bot y toca «Reintentar».", true);
        }
      });
    });
  }

  function iniciar() {
    intento += 1;
    var mio = intento;
    estado("", "Obteniendo tu ubicación…", "Si Telegram te pregunta, toca «Permitir». Esta pantalla se cierra sola.");
    if (!tg || !tg.platform || tg.platform === "unknown") {
      return error("Ábrelo desde el bot", "Esta pantalla solo funciona desde el botón de ubicación del bot en Telegram.", false);
    }
    var nuevo = false;
    try { nuevo = tg.isVersionAtLeast && tg.isVersionAtLeast("8.0"); } catch (e) {}
    if (nuevo) viaTelegram(mio); else viaNavegador(mio);
  }

  $("btnReintentar").onclick = iniciar;
  $("btnCerrar").onclick = function () { try { tg.close(); } catch (e) { window.close(); } };
  $("btnAjustes").onclick = function () { try { tg.LocationManager.openSettings(); } catch (e) {} };

  iniciar();
})();
</script>
</body>
</html>
